<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Accent Glows -->
    <linearGradient id="cyanIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="30" cy="0" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .title { font-weight: 800; letter-spacing: -0.5px; fill: url(#textGrad); }
    .subtitle { font-weight: 500; fill: #94a3b8; letter-spacing: 0.2px; }
    .tag-text { font-weight: 600; font-size: 11px; letter-spacing: 0.8px; }
  </style>

  <!-- Container Box with Rounded Edges -->
  <rect x="2" y="2" width="1196" height="336" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Subtle Matrix Grid -->
  <rect x="2" y="2" width="1196" height="336" rx="16" fill="url(#grid)" />

  <!-- Atmospheric Glow Spheres -->
  <circle cx="210" cy="170" r="140" fill="#38bdf8" fill-opacity="0.08" filter="url(#softGlow)" />
  <circle cx="1050" cy="80" r="180" fill="#818cf8" fill-opacity="0.05" filter="url(#softGlow)" />

  <!-- ================= LEFT EMBLEM: ALGORITHMIC GEOMETRY ================= -->
  <g transform="translate(45, 10)">
    <!-- Cache Line Memory Bar (Hardware Foundation) -->
    <g transform="translate(40, 275)">
      <rect x="0" y="0" width="250" height="20" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <!-- Segment Blocks representing 64-byte Cache Line / Array Slots -->
      <rect x="3" y="3" width="28" height="14" rx="2" fill="#38bdf8" fill-opacity="0.8" />
      <rect x="34" y="3" width="28" height="14" rx="2" fill="#38bdf8" fill-opacity="0.5" />
      <rect x="65" y="3" width="28" height="14" rx="2" fill="#818cf8" fill-opacity="0.6" />
      <rect x="96" y="3" width="28" height="14" rx="2" fill="#818cf8" fill-opacity="0.9" />
      <rect x="127" y="3" width="28" height="14" rx="2" fill="#6366f1" fill-opacity="0.4" />
      <rect x="158" y="3" width="28" height="14" rx="2" fill="#0284c7" fill-opacity="0.7" />
      <rect x="189" y="3" width="28" height="14" rx="2" fill="#38bdf8" fill-opacity="0.3" />
      <rect x="220" y="3" width="27" height="14" rx="2" fill="#818cf8" fill-opacity="0.5" />
      <text x="125" y="33" text-anchor="middle" class="mono" font-size="9" fill="#64748b" letter-spacing="1">64-BYTE CACHE LINE ALIGNMENT</text>
    </g>

    <!-- Graph Edges / Tree Hierarchy Lines -->
    <!-- Root to Level 1 -->
    <path d="M 165 75 L 105 145" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.7" />
    <path d="M 165 75 L 225 145" stroke="#818cf8" stroke-width="2.5" stroke-opacity="0.7" />

    <!-- Level 1 to Level 2 -->
    <path d="M 105 145 L 65 215" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.5" />
    <path d="M 105 145 L 145 215" stroke="#38bdf8" stroke-width="1.8" stroke-opacity="0.5" />
    <path d="M 225 145 L 185 215" stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.5" />
    <path d="M 225 145 L 265 215" stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.5" />

    <!-- Leaf Projections to Cache Line -->
    <path d="M 65 215 L 54 275" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.4" />
    <path d="M 145 215 L 110 275" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.4" />
    <path d="M 185 215 L 203 275" stroke="#818cf8" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.4" />
    <path d="M 265 215 L 233 275" stroke="#818cf8" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.4" />

    <!-- Vertex Nodes -->
    <!-- Root Node -->
    <g transform="translate(165, 75)" filter="url(#glow)">
      <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
      <circle cx="0" cy="0" r="7" fill="#38bdf8" />
    </g>

    <!-- Level 1 Nodes -->
    <g transform="translate(105, 145)">
      <circle cx="0" cy="0" r="13" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#38bdf8" fill-opacity="0.9" />
    </g>
    <g transform="translate(225, 145)">
      <circle cx="0" cy="0" r="13" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
      <circle cx="0" cy="0" r="5" fill="#818cf8" fill-opacity="0.9" />
    </g>

    <!-- Level 2 Nodes (Leaves) -->
    <g transform="translate(65, 215)">
      <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
      <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    </g>
    <g transform="translate(145, 215)">
      <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
      <circle cx="0" cy="0" r="4" fill="#38bdf8" />
    </g>
    <g transform="translate(185, 215)">
      <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.8" />
      <circle cx="0" cy="0" r="4" fill="#818cf8" />
    </g>
    <g transform="translate(265, 215)">
      <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.8" />
      <circle cx="0" cy="0" r="4" fill="#818cf8" />
    </g>
  </g>

  <!-- ================= VERTICAL DIVIDER ================= -->
  <line x1="395" y1="50" x2="395" y2="290" stroke="#334155" stroke-width="1.2" stroke-dasharray="4,4" stroke-opacity="0.6" />

  <!-- ================= RIGHT SECTION: TYPOGRAPHY & SPECS ================= -->
  <g transform="translate(435, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 52)">
      <rect x="0" y="0" width="310" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <circle cx="12" cy="12" r="4" fill="#38bdf8" />
      <text x="24" y="16" class="mono" font-size="10.5" font-weight="700" fill="#38bdf8" letter-spacing="1.2">INVARIANT-FIRST ARCHITECTURE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="128" class="sans title" font-size="52">THE DSA HANDBOOK</text>

    <!-- Subtitle -->
    <text x="0" y="166" class="sans subtitle" font-size="18.5">
      The Invariant-First Reference Manual &amp; Implementation Archive
    </text>

    <!-- Core Description -->
    <text x="0" y="202" class="sans" font-size="13.5" fill="#64748b" font-weight="400">
      From discrete proofs and formal invariants to CPU cache locality, lock-free concurrency &amp; storage engines.
    </text>

    <!-- Metric / Feature Badges -->
    <g transform="translate(0, 238)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="150" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="16" y="21" class="mono tag-text" fill="#38bdf8">154 CHAPTERS</text>
      </g>

      <!-- Badge 2 -->
      <g transform="translate(162, 0)">
        <rect x="0" y="0" width="168" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="16" y="21" class="mono tag-text" fill="#a5b4fc">C++17 &amp; PYTHON 3</text>
      </g>

      <!-- Badge 3 -->
      <g transform="translate(342, 0)">
        <rect x="0" y="0" width="176" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="16" y="21" class="mono tag-text" fill="#34d399">CACHE &amp; HARDWARE</text>
      </g>

      <!-- Badge 4 -->
      <g transform="translate(530, 0)">
        <rect x="0" y="0" width="170" height="34" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
        <text x="16" y="21" class="mono tag-text" fill="#f472b6">LOCK-FREE ENGINES</text>
      </g>
    </g>
  </g>
</svg>
